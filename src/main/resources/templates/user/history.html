<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Sử Xem Phim — LuMovie</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <div class="page-wrapper">
    <div style="padding:48px">

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
        <h1 style="font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:#e8b84b">📺 LỊCH SỬ XEM
          PHIM</h1>
        <span th:if="${guestId != null}" class="badge" style="background:#333;color:#ccc">KHÁCH</span>
        <span th:if="${guestId == null}" class="badge badge-gold">ĐÃ ĐĂNG NHẬP</span>
      </div>

      <!-- Empty state -->
      <div th:if="${history == null or #lists.isEmpty(history)}"
        style="text-align:center;padding:60px 0;background:#141419;border-radius:12px;border:1px solid rgba(200,146,42,0.1)">
        <div style="font-size:3rem;margin-bottom:12px">📺</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;color:#605848">CHƯA XEM PHIM
          NÀO</div>
        <p style="font-size:0.83rem;color:#605848;margin:8px 0 20px">Bắt đầu xem phim và lịch sử sẽ xuất hiện ở đây</p>
        <a th:href="@{/movies}" class="btn btn-gold">🎬 Xem Phim Ngay</a>
      </div>

      <!-- History List -->
      <div th:if="${history != null and !#lists.isEmpty(history)}" style="display:flex;flex-direction:column;gap:12px">
        <div th:each="item : ${history}" style="display:flex;gap:16px;background:#141419;border:1px solid rgba(200,146,42,0.1);
                  border-radius:12px;padding:16px;align-items:center">
          <div style="width:64px;height:96px;border-radius:8px;overflow:hidden;flex-shrink:0">
            <img th:if="${item.episode != null and item.episode.movie != null and item.episode.movie.posterUrl != null}"
              th:src="${item.episode.movie.posterUrl}" style="width:100%;height:100%;object-fit:cover"
              th:alt="${item.episode.movie.title}" />
            <div
              th:unless="${item.episode != null and item.episode.movie != null and item.episode.movie.posterUrl != null}"
              style="width:100%;height:100%;background:#1a1a22;display:flex;align-items:center;justify-content:center">
              🎬</div>
          </div>
          <div style="flex:1;min-width:0">
            <a th:if="${item.episode != null and item.episode.movie != null}"
              th:href="@{/movies/{slug}(slug=${item.episode.movie.slug})}" style="font-weight:600;color:#e8e0d0;font-size:1rem;text-decoration:none;
                    display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
              th:text="${item.episode.movie.title}">Tên Phim</a>
            <div style="font-size:0.8rem;color:#605848;margin-top:6px"
              th:text="'Xem gần nhất: ' + ${#temporals.format(item.lastWatchedTime,'dd/MM/yyyy HH:mm')}">Thời gian</div>
            <div th:if="${item.episode != null}" style="font-size:0.8rem;color:#a09880;margin-top:2px"
              th:text="'Đang xem: Tập ' + ${item.episode.episodeNumber}">Tập 1</div>
          </div>
          <a th:if="${item.episode != null and item.episode.movie != null}"
            th:href="@{/movies/{slug}/watch(slug=${item.episode.movie.slug},ep=${item.episode.episodeNumber})}"
            class="btn btn-gold btn-sm">▶ Xem Tiếp</a>
        </div>
      </div>

    </div>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
